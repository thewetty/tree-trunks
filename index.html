<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1018">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tree Trunks">
<title>Tree Trunks C5</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
/* VOICE: a coach's clipboard, terse and specific, a little roast
   IDEA: the gym logbook: one page per session, a box for every set
   PICTURE: the working session itself: set rows you tick off, loads and plates per side
   COLOUR and TYPE: night navy, slate cards, cyan accent, green for done; system UI type, tabular numbers
   LAYOUT: sticky week/day rail + progress, one column of exercise cards, rest timer docked at the bottom */
:root{color-scheme:dark;--bg:#0b1018;--bg2:#10182b;--card:#141e31;--card2:#1a2740;--line:#263652;--ink:#eef5ff;--mute:#9aaecb;--dim:#6f84a6;--acc:#5ca7ff;--ok:#45d6a0;--warn:#ffc278;--bad:#ff8193}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:170px}
body{margin:0;background:linear-gradient(180deg,var(--bg) 0,var(--bg2) 55%,var(--bg) 100%) fixed;color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow-x:clip;padding-bottom:calc(110px + env(safe-area-inset-bottom));font-variant-numeric:tabular-nums}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.top{position:sticky;top:0;z-index:30;background:rgba(11,16,24,.95);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left))}
.row1{display:flex;align-items:center;gap:8px;max-width:760px;margin:0 auto}
.brand{font-weight:800;font-size:17px;letter-spacing:-.01em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:var(--mute);font-weight:600}
.sync{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:5px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block}
.sync.cloud i{background:var(--ok)}.sync.err i{background:var(--bad)}.sync.wait i{background:var(--warn)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:8px 11px;border-radius:9px;font-size:14px;font-weight:700;color:var(--mute);min-height:38px}
.seg button.on{background:var(--acc);color:#05101f}
.rail{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:6px 0 0;max-width:760px;margin:0 auto;scroll-snap-type:x proximity}
.rail::-webkit-scrollbar{display:none}
.chip{flex:none;scroll-snap-align:start;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:4px 11px;min-height:44px;font-size:14px;font-weight:700;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;position:relative}
.chip small{font-size:11px;font-weight:600;color:var(--dim)}
.chip.on{border-color:var(--acc);color:var(--ink);background:#173055}
.chip.on small{color:var(--acc)}
.chip.today::before{content:"";position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--acc)}
.chip.part{box-shadow:inset 0 -3px 0 var(--warn)}
.chip.full{box-shadow:inset 0 -3px 0 var(--ok)}
.pbar{max-width:760px;margin:6px auto 0;display:flex;align-items:center;gap:10px;padding-bottom:8px}
.pbar .track{flex:1;height:8px;background:#0e1626;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.pbar .fill{height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--ok));transition:width .25s}
.pbar span{font-size:13px;color:var(--mute);white-space:nowrap;font-weight:600}
main{max-width:760px;margin:0 auto;padding:12px max(12px,env(safe-area-inset-left)) 0}
.hero{background:linear-gradient(140deg,#16284a,#121c30 70%);border:1px solid #2c4470;border-radius:20px;padding:16px}
.hero .meta{color:var(--acc);font-size:13px;font-weight:700}
.hero h2{margin:2px 0 8px;font-size:30px;line-height:1.08;letter-spacing:-.02em;text-wrap:balance}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.pill{background:#0e1830;border:1px solid #2c4470;border-radius:99px;padding:4px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.note{margin:0;color:#d7e4f7;font-size:15px}
.flag{margin-top:10px;background:#2a2213;border:1px solid #5b4720;color:var(--warn);border-radius:12px;padding:8px 10px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0}
.card h3{margin:0;font-size:19px;line-height:1.2;letter-spacing:-.01em}
.exh{display:flex;gap:10px;align-items:flex-start}
.exh .t{flex:1}
.rx{color:var(--acc);font-weight:700;font-size:14px;margin-top:3px}
.cue{color:var(--mute);font-size:14px;margin:8px 0 4px}
.restb{flex:none;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:6px 10px;min-height:44px;font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap}
.set{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:54px;padding:6px 2px;border-top:1px solid #1f2d47;cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative}
.set input{position:absolute;opacity:0;width:1px;height:1px}
.box{width:34px;height:34px;border-radius:10px;border:2px solid #3d5680;background:#0d1524;display:grid;place-items:center;transition:background .15s,border-color .15s}
.set.on .box{background:var(--ok);border-color:var(--ok)}
.set.on .box::after{content:"";width:9px;height:16px;border:solid #052016;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
.set input:focus-visible+.box{outline:2px solid var(--acc);outline-offset:2px}
.sl{font-size:15px;font-weight:700;line-height:1.25}
.sl em{font-style:normal;font-size:11px;font-weight:800;color:var(--dim);margin-right:6px;letter-spacing:.02em}
.sl .pl{display:block;font-weight:500;font-size:13px;color:var(--mute)}
.sw{font-size:16px;font-weight:800;text-align:right;white-space:nowrap}
.set.wu .sl,.set.wu .sw{color:#c2d1e8}
.set.wu .sw{font-weight:700}
.set.opt{opacity:.85}
.set.opt .sl em{color:var(--warn)}
.set.on .sw{color:var(--ok)}
.log{margin-top:8px;padding-top:10px;border-top:1px dashed #2a3c5c;display:grid;gap:8px}
.lr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:8px}
.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute);font-weight:600}
.f input,.f textarea{width:100%;min-height:44px;border-radius:11px;border:1px solid var(--line);background:#0c1422;padding:9px 11px;font-size:16px;color:var(--ink)}
.f textarea{min-height:84px;resize:vertical}
.f input::placeholder,.f textarea::placeholder{color:#55688a}
.rirs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rirs b{font-size:12px;color:var(--mute);font-weight:600;width:100%}
.rc{min-width:44px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:#0c1422;font-weight:800;font-size:14px;color:var(--mute);padding:0 8px}
.rc.on{background:var(--acc);border-color:var(--acc);color:#05101f}
.hist{font-size:13px;color:var(--mute)}
.hint{font-size:13px;color:var(--warn)}
.ci{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.ci .wide{grid-column:1/-1}
.jp{text-align:left}
.jp .k{font-size:38px;font-weight:700;line-height:1.1}
.jp .r{color:var(--acc);font-weight:700}
.jp p{margin:6px 0 0;font-size:15px}
.jp .s{font-size:19px}
.muted{color:var(--mute);font-size:14px}
.btn{border:1px solid var(--line);background:var(--card2);border-radius:12px;min-height:46px;padding:10px 14px;font-weight:700;font-size:15px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#05101f}
.btn.danger{border-color:#6a2c38;color:var(--bad);background:#1e1218}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.lift h4{margin:14px 0 4px;font-size:16px}
.lrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;padding:7px 0;border-top:1px solid #1f2d47;font-size:14px;align-items:baseline}
.lrow .w{color:var(--dim);font-weight:700}
.lrow .e{color:var(--acc);font-weight:700;white-space:nowrap}
.lrow .pl{color:var(--mute)}
textarea.out{width:100%;min-height:220px;border-radius:12px;border:1px solid var(--line);background:#0c1422;color:var(--ink);padding:10px;font:13px/1.45 ui-monospace,Menlo,monospace}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.stat{background:#0e1830;border:1px solid var(--line);border-radius:14px;padding:10px}
.stat b{display:block;font-size:24px;line-height:1.1}
.stat span{font-size:12px;color:var(--mute)}
.timer{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(9,14,22,.97);border-top:1px solid var(--line);padding:8px max(10px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.timer .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px}
.tv{font-size:26px;font-weight:800;min-width:72px;letter-spacing:-.01em}
.tv small{display:block;font-size:11px;color:var(--mute);font-weight:600;letter-spacing:0}
.tps{display:flex;gap:6px;flex:1;overflow-x:auto;scrollbar-width:none}
.tps::-webkit-scrollbar{display:none}
.tps button{flex:1 0 auto;min-height:44px;min-width:46px;border-radius:11px;border:1px solid var(--line);background:var(--card2);font-weight:700;font-size:14px;padding:0 8px}
.tps .stop{color:var(--bad)}
.timer.run .tv{color:var(--acc)}
.timer.done{background:#0f3a2c}.timer.done .tv{color:var(--ok)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(3,6,12,.7);display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.modal .card{max-width:420px;width:100%}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#22324f;border:1px solid #36507c;padding:10px 14px;border-radius:12px;font-size:14px;font-weight:600;z-index:70;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.sw2{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute);margin-top:10px}
.sw2 input{width:22px;height:22px;accent-color:var(--acc)}
.big{font-size:clamp(40px,12vw,56px);font-weight:800;line-height:1.05;letter-spacing:-.03em;margin:4px 0 6px}
.big span{font-size:16px;color:var(--mute);font-weight:700;letter-spacing:0;margin-left:6px}
.cols{display:flex;align-items:flex-end;gap:6px;height:190px;margin-top:12px}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;border:0;background:none;padding:0;gap:4px;min-width:0}
.cb{display:block;background:#3d8fe8;border-radius:4px 4px 0 0;min-height:0;transition:height .3s}
.col.on .cb{background:#6fb0ff}
.cv{font-size:11px;color:var(--mute);font-weight:700;text-align:center}
.cx{font-size:12px;color:var(--mute);font-weight:700;text-align:center;border-top:1px solid #2a3c5c;padding-top:4px}
.cap{min-height:22px;margin-top:8px;font-size:14px;font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 4px;font-size:13px;color:#d7e4f7;font-weight:600}
.legend i,.tip i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.fig{position:relative;height:240px;margin-top:6px}.fig.sm{height:180px}
.fig svg{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y}
.tip{position:absolute;z-index:2;background:#0b1220;border:1px solid #33496f;border-radius:10px;padding:6px 9px;font-size:13px;pointer-events:none;min-width:130px}
.tip .th{color:var(--mute);font-size:12px;font-weight:700}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font-size:14px;text-align:center;padding:20px}
.hb{margin-top:12px}.hl{display:flex;justify-content:space-between;gap:8px;font-size:14px}.hl b{white-space:nowrap}
.ht{height:10px;background:#0e1626;border-radius:99px;margin-top:5px;overflow:hidden}.ht i{display:block;height:100%;background:#3d8fe8;border-radius:99px}
@media (max-width:440px){.sync span{display:none}}
@media (max-width:380px){.hero h2{font-size:26px}.tv{font-size:22px;min-width:60px}.seg button{padding:8px 8px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="row1">
    <div class="brand">Tree Trunks <small>C5</small></div>
    <div class="sync" id="sync"><i></i><span>This device</span></div>
    <div class="seg" role="tablist"><button id="vW" class="on" role="tab" data-v="w">Workout</button><button id="vS" role="tab" data-v="s">Stats</button><button id="vL" role="tab" data-v="l">Log</button></div>
  </div>
  <div class="rail" id="weeks" aria-label="Week"></div>
  <div class="rail" id="days" aria-label="Day"></div>
  <div class="pbar"><div class="track"><div class="fill" id="pfill"></div></div><span id="ptxt">0/0 sets</span></div>
</header>
<main id="main"></main>
<div class="timer" id="timer"><div class="in">
  <div class="tv" id="tval">0:00<small>Rest timer</small></div>
  <div class="tps"><button data-t="90">1:30</button><button data-t="120">2:00</button><button data-t="180">3:00</button><button data-t="300">5:00</button><button class="stop" data-t="0">Stop</button></div>
</div></div>
<div class="modal" id="modal"><div class="card"><h3 id="mT">Are you sure?</h3><p class="muted" id="mB"></p><div class="btns"><button class="btn" id="mNo">Cancel</button><button class="btn danger" id="mYes">Erase</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
{
/* ===== PROGRAM ===== */
const START=new Date(2026,10,30);
const DK=["mon","tue","wed","thu","fri","sat"],DN=["Mon","Tue","Wed","Thu","Fri","Sat"];
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const r5=x=>Math.round(x/5)*5;
const SQT=[325,330,335,340,345,350],SQR=["5","5","5","4–5","4","3–4"];
const BNT=[295,300,305,310,315,320],BNR=["5","5","4–5","4","3–4","2–4"];
const DLT=[455,465,475,480,485,495],DLR=["4","4","3–4","3–4","3","2–3"];
const TR=["~3","2–3","~2","2–3","1–2","1–2"],DTR=["2–3","2–3","~2","2–3","1–2","1–2"];
const BDR=[6,6,6,5,5,5],DBR=[4,4,3,3,3,3];
const PSQ=[210,215,220,225,230,230],SSQ=[255,260,265,270,275,275],SBN=[260,265,270,275,275,280];
const WEEKINT=["Re-entry, ~3 RIR","Accumulate quality work","~2 RIR, optional controlled single","Christmas week, flexible","Hard work, no forced failure","Only if progression was earned","Deload"];
function X(id,name,o){return Object.assign({id,name,kind:"bar",warm:[],sets:[],rir:"",rest:120,cue:"",prog:"",top:0,lift:""},o)}
function S(n,w,r,lbl){return Array.from({length:n},(_,i)=>({w,r:String(r),lbl:lbl?(n>1?lbl+" "+(i+1):lbl):"Set "+(i+1),opt:false}))}
const WU={
 sq:t=>{const a=[[45,10],[135,5],[185,3],[225,2]].filter(x=>x[0]<=t-40);if(t>=300){a.push([r5(t*.85),1]);a.push([r5(t*.93),1,1])}return a},
 sql:t=>[[45,10],[135,5],[185,3]].filter(x=>x[0]<=t-25),
 bn:t=>{const a=[[45,10],[95,5],[135,3],[185,2],[225,1]].filter(x=>x[0]<=t-35);if(t>=280)a.push([r5(t*.9),1]);return a},
 dl:t=>{const a=[[135,5],[225,3],[315,2],[365,1],[405,1]].filter(x=>x[0]<=t-45);if(t>=480)a.push([r5(t*.93),1]);return a},
 inc:t=>[[45,10],[95,5],[135,3],[175,1]].filter(x=>x[0]<=t-25),
 ohp:[[95,5,1],[115,3,1]],
 ssq:t=>[[135,5],[r5(t*.8),3]],
 rdl:[[135,5,1],[225,3,1]]
};
const C={
 ext:"Tendon check: moderate load, smooth reps. If the left patellar tendon complains, cut the load before you cut sets.",
 hc:"Control the lowering, full stretch, hips stay down.",
 tri:"Elbows fixed, full lockout, slow on the way down."
};
function trainDay(w,d){const i=w-1,tr=TR[i];
 if(d===0)return{title:"Squat strength",pills:[`Squat ${SQT[i]}×${SQR[i]}`,`RIR ${tr}`,`Backdowns ${SQT[i]-30}×${BDR[i]}×2`],ex:[
  X("sq_top","Back squat: top set",{warm:WU.sq(SQT[i]),sets:S(1,SQT[i],SQR[i],"Top set"),rir:tr,rest:240,top:1,lift:"Squat",cue:"Brace before every rep, even foot pressure, hips and chest rise together. Every warm-up is a neck check."}),
  X("sq_bd","Back squat: backdowns",{sets:S(2,SQT[i]-30,BDR[i],"Backdown"),rir:"2–3",rest:180,cue:"Same depth as the top set. If the top set was a grind, take 10 lb off here."}),
  X("rdl","Romanian deadlift",{warm:WU.rdl,sets:S(2,280,"8–10"),rir:"2–3",rest:150,prog:"d",cue:"Stop where the hamstring stretch and pelvis stay consistent, not at max shin depth. Neutral neck at the top."}),
  X("ext","Leg extension",{kind:"mach",sets:S(3,null,"12–20"),rir:"1–2",rest:75,prog:"d",cue:C.ext}),
  X("calf","Supported single-leg calf raise",{kind:"bw",sets:S(3,null,"8–15/leg"),rir:"1–2",rest:60,prog:"d",cue:"Stable non-slip step, hold the support, full stretch, pause at the top. Add a dumbbell once 15s are easy."})]};
 if(d===1)return{title:"Bench strength",pills:[`Bench ${BNT[i]}×${BNR[i]}`,`RIR ${tr}`,`Backdowns ${BNT[i]-35}×${BDR[i]}×3`],ex:[
  X("bn_top","Bench press: top set",{warm:WU.bn(BNT[i]),sets:S(1,BNT[i],BNR[i],"Top set"),rir:tr,rest:240,top:1,lift:"Bench",cue:"Your arch, your leg drive, butt on the bench, touch just below the pecs. Watch bar speed on the last rep. Safeties or a spotter."}),
  X("bn_bd","Bench press: backdowns",{sets:S(3,BNT[i]-35,BDR[i],"Backdown"),rir:"2–3",rest:180,cue:"Same touch point every rep. Set 3 is new this cycle."}),
  X("wpu","Weighted pull-up (overhand)",{kind:"belt",sets:S(3,70,"6–8"),rir:"1–3",rest:150,prog:"d",cue:"Full elbow extension at the bottom, no leg swing. Add 5 lb once you hit 8/8/8."}),
  X("row","Bent-over barbell row",{warm:[[135,6,1]],sets:S(3,165,"10–12"),rir:"2–3",rest:120,prog:"d",cue:"Fixed hinge, pull to the lower abdomen, controlled lowering. No torso swing on the late reps."}),
  X("tri","Triceps extension",{kind:"cable",sets:S(2,null,"10–15"),rir:"1–2",rest:75,prog:"d",cue:C.tri})]};
 if(d===2){const ss=S(2,null,"10–15");if(w===1)ss[1].opt=true;
  return{title:"Lower hypertrophy",pills:[`Paused squat ${PSQ[i]}×8–10×3`,"Quads, hams, calves"],ex:[
  X("psq","Paused back squat (2 s)",{warm:WU.sql(PSQ[i]),sets:S(3,PSQ[i],"8–10"),rir:"2–3",rest:180,lift:"Paused squat",cue:"A real 2-second pause in the hole every rep. Brace each rep, short resets at the top, hips and chest rise together."}),
  X("ext","Leg extension",{kind:"mach",sets:S(3,null,"12–20"),rir:"1–2",rest:75,prog:"d",cue:C.ext}),
  X("hc","Hamstring curl",{kind:"mach",sets:S(3,null,"10–15"),rir:"1–2",rest:75,prog:"d",cue:C.hc}),
  X("calf","Calf raise",{kind:"mach",sets:S(3,null,"12–20"),rir:"1–2",rest:60,prog:"d",cue:"Full stretch at the bottom, pause at the top, no bouncing."}),

  L2.push(`### W${w===7?"7 (deload)":w} ${nice(dateOf(w,d))}: ${D.title} (${dn}/${ss.length} required sets ticked)`);
  if(!any){L2.push("No data logged.");continue}
  const dd=s.d||{};const ci=[dd.bw&&"BW "+dd.bw+" lb",dd.sl&&"sleep "+dd.sl+" h",dd.neck&&"neck "+dd.neck+"/10",dd.knee&&"knee "+dd.knee+"/10",dd.pre&&"pre-workout: "+dd.pre].filter(Boolean);if(ci.length)L2.push("Check-in: "+ci.join(" · "));
  for(const ex of D.ex){const x=s.x[ex.id]||{};const n=ex.sets.filter((_,j)=>s.c[ex.id+".s"+j]).length;const pw=ex.prog==="d"?effW(ex,w,d):ex.sets[0].w;
   L2.push(`- ${ex.name}: planned ${pw?(ex.kind==="belt"?"+":"")+pw+" × ":""}${ex.sets[0].r} × ${ex.sets.length}${ex.rir?" (RIR "+ex.rir+")":""} | sets ticked ${n}/${ex.sets.length}${x.w||x.r?` | logged ${x.w||"—"} × ${x.r||"—"}`:""}${x.rir?" @ RIR "+x.rir:""}${x.n?" | note: "+x.n:""}`)}
  if(dd.notes)L2.push("Notes: "+dd.notes)}
 return L2.join("\n")}
const js=()=>JSON.stringify({app:"treetrunks-c5",version:1,exportedAt:new Date().toISOString(),start:"2026-11-30",days:L},null,1);
async function copy(txt,label){try{await navigator.clipboard.writeText(txt);toast(label+" copied")}catch(e){const o=$("#out");o.hidden=false;o.value=txt;o.focus();o.select();toast("Copy blocked here. Text selected below; copy it manually.")}}
function save(name,data){try{const type=name.endsWith(".json")?"application/json":"text/markdown";const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast("Saved "+name)}catch(e){toast("Couldn't save. Use Copy log instead.")}}

/* ===== TIMER ===== */
let tEnd=0,tInt=null,actx=null;
function aud(){try{if(!actx){const A=window.AudioContext||window.webkitAudioContext;if(A)actx=new A()}if(actx&&actx.state==="suspended")actx.resume().catch(()=>{})}catch(e){}}
function beep(){try{if(!actx)return;const t0=actx.currentTime;[0,.25,.5].forEach(o=>{const g=actx.createGain(),os=actx.createOscillator();os.frequency.value=880;g.gain.setValueAtTime(.0001,t0+o);g.gain.exponentialRampToValueAtTime(.35,t0+o+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+o+.18);os.connect(g).connect(actx.destination);os.start(t0+o);os.stop(t0+o+.2)})}catch(e){}}
function tset(txt,sub){$("#tval").innerHTML=esc(txt)+"<small>"+esc(sub)+"</small>"}
function startT(sec){aud();const tm=$("#timer");tm.classList.remove("done");clearInterval(tInt);if(!sec){tEnd=0;tm.classList.remove("run");tset("0:00","Rest timer");return}
 tEnd=Date.now()+sec*1000;tm.classList.add("run");tick();tInt=setInterval(tick,250)}
function tick(){const ms=tEnd-Date.now();const tm=$("#timer");if(ms<=0){clearInterval(tInt);tm.classList.remove("run");tm.classList.add("done");tset("Go","Next set");beep();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}return}
 const s=Math.ceil(ms/1000);tset(Math.floor(s/60)+":"+String(s%60).padStart(2,"0"),"Resting")}

/* ===== EVENTS ===== */
let tt=null;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2600)}
let mCb=null;function confirmBox(title,body,cb){$("#mT").textContent=title;$("#mB").textContent=body;mCb=cb;$("#modal").classList.add("on")}
$("#mNo").addEventListener("click",()=>{$("#modal").classList.remove("on");mCb=null});
$("#mYes").addEventListener("click",()=>{$("#modal").classList.remove("on");const f=mCb;mCb=null;f&&f()});
function setView(v){view=v;document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",b.dataset.v===v))}
document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>{setView(b.dataset.v);render();scrollTo(0,0)}));
$("#weeks").addEventListener("click",e=>{const b=e.target.closest("[data-w]");if(!b)return;cw=+b.dataset.w;setView("w");render();scrollTo(0,0)});
$("#days").addEventListener("click",e=>{const b=e.target.closest("[data-d]");if(!b)return;cd=+b.dataset.d;setView("w");render();scrollTo(0,0)});
$(".tps").addEventListener("click",e=>{const b=e.target.closest("[data-t]");if(b)startT(+b.dataset.t)});
const M=$("#main");
M.addEventListener("change",e=>{const t=e.target;const k=dk(cw,cd);
 if(t.dataset.s){const s=st(k);if(t.checked)s.c[t.dataset.s]=1;else delete s.c[t.dataset.s];t.closest(".set").classList.toggle("on",t.checked);touch(k);progress();chips();
  if(t.checked&&t.dataset.rest&&autoRest)startT(+t.dataset.rest);
  const ss=sets(P[cw][cd]).filter(x=>!x.opt);if(t.checked&&ss.every(x=>s.c[x.id]))toast("Session complete. Log your top-set RIR if you haven't.");return}
 if(t.id==="auto"){autoRest=t.checked;try{localStorage.setItem(LK+":auto",autoRest?"1":"0")}catch(e){}return}
 if(t.id==="imp"&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);const days=o&&o.days;if(!days||typeof days!=="object")throw 0;let n=0;
   for(const k in days){if(!/^w[1-7]-(mon|tue|wed|thu|fri|sat)$/.test(k))continue;const v=days[k]||{};L[k]={c:v.c&&typeof v.c==="object"?v.c:{},x:v.x&&typeof v.x==="object"?v.x:{},d:v.d&&typeof v.d==="object"?v.d:{},u:0};touch(k);n++}
   render();toast("Imported "+n+" sessions")}catch(err){toast("That file isn't a Tree Trunks backup")}};r.readAsText(t.files[0])}});
M.addEventListener("input",e=>{const t=e.target;const k=dk(cw,cd);
 if(t.dataset.f){const id=t.closest("[data-x]").dataset.x;const s=st(k);s.x[id]=Object.assign({},s.x[id],{[t.dataset.f]:t.value});touch(k);return}
 if(t.dataset.d){const s=st(k);s.d=Object.assign({},s.d,{[t.dataset.d]:t.value});touch(k)}});
M.addEventListener("click",e=>{const t=e.target;const k=dk(cw,cd);
 const rb=t.closest(".restb");if(rb){startT(+rb.dataset.rest);return}
 if(t.dataset.rir!=null){const id=t.closest("[data-x]").dataset.x;const s=st(k);const cur=(s.x[id]||{}).rir;const v=cur===t.dataset.rir?"":t.dataset.rir;s.x[id]=Object.assign({},s.x[id],{rir:v});touch(k);
  t.parentNode.querySelectorAll(".rc").forEach(b=>b.classList.toggle("on",b.dataset.rir===v));return}
 if(t.dataset.pre!=null){const s=st(k);const v=(s.d||{}).pre===t.dataset.pre?"":t.dataset.pre;s.d=Object.assign({},s.d,{pre:v});touch(k);t.parentNode.querySelectorAll(".rc").forEach(b=>b.classList.toggle("on",b.dataset.pre===v));return}
 if(t.id==="resetDay"){confirmBox("Reset this day?","Clears every tick, log entry and note for "+nice(dateOf(cw,cd))+".",()=>{L[k]=blank();touch(k);render();toast("Day reset")});return}
 if(t.id==="eraseAll"){confirmBox("Erase the whole cycle?","Clears every tick, log entry and note for all 42 sessions, on every synced device. Export a backup first if you might want it.",()=>{for(let w=1;w<=7;w++)for(let d=0;d<6;d++){const kk=dk(w,d);if(L[kk]){L[kk]=blank();touch(kk)}}render();toast("Cycle erased")});return}
 if(t.id==="cpMd"){copy(md(),"Log");return}
 if(t.id==="cpJs"){copy(js(),"Backup");return}
 if(t.id==="dlMd"){save("Cycle5_TreeTrunks_Log.md",md());return}
 if(t.id==="dlJs"){save("Cycle5_TreeTrunks_Backup.json",js());return}
});
render();
}
